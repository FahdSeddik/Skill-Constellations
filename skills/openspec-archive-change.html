<style>html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
.brand {
  position: absolute; right: 22px; top: 20px; z-index: 3; pointer-events: none;
  font-size: 11px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted); opacity: 0.75;
  text-shadow: 0 0 6px var(--sky), 0 0 2px var(--sky);
}
.caption {
  position: absolute; left: 50%; bottom: calc(var(--dock, 96px) + 14px); z-index: 3; max-width: min(820px, 70vw); transform: translateX(-50%);
  pointer-events: none; text-align: center; font-size: 13px; line-height: 1.45; color: var(--muted);
  text-shadow: 0 0 8px var(--sky), 0 0 3px var(--sky); opacity: 0.95; transition: opacity 1600ms ease;
}
.caption.faded { opacity: 0; }
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
  background: linear-gradient(to bottom, transparent, var(--sky) 34px);
}
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding: 26px 22px 6px;
  font-size: 12.5px; color: var(--muted); text-shadow: 0 0 6px var(--sky);
}
.legend .item { display: inline-flex; align-items: center; gap: 8px; }
.legend canvas { width: 24px; height: 18px; }
.controls { display: flex; align-items: center; gap: 16px; padding: 6px 22px 14px; }
.play {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid var(--muted); background: transparent; color: var(--ink); display: grid; place-items: center;
}
.play:hover, .play:focus-visible { border-color: var(--ink); outline: none; }
.play svg { width: 13px; height: 13px; fill: currentColor; }
.speeds { flex: 0 0 auto; display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.speeds button {
  background: transparent; border: 0; color: var(--muted); font: inherit; font-size: 12.5px;
  padding: 5px 11px; cursor: pointer; font-variant-numeric: lining-nums;
}
.speeds button:hover { color: var(--ink); }
.speeds button.on { color: var(--sky); background: var(--ink); }
.scrub { flex: 1 1 auto; min-width: 80px; margin: 0; height: 22px; background: transparent; cursor: pointer; -webkit-appearance: none; appearance: none; }
.scrub:focus { outline: none; }
.scrub::-webkit-slider-runnable-track {
  height: 3px; border-radius: 3px;
  background: linear-gradient(to right, var(--ink) 0 var(--done), var(--line) var(--done) 100%);
}
.scrub::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%;
  background: var(--star); box-shadow: 0 0 10px var(--glow);
}
.scrub::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line); }
.scrub::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--ink); }
.scrub::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--star); }
.reset {
  position: absolute; right: 18px; z-index: 3; padding: 5px 12px; border-radius: 999px;
  font: inherit; font-size: 12.5px; color: var(--ink); background: var(--haze); border: 1px solid var(--line);
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 200ms ease;
}
.reset.on { opacity: 1; pointer-events: auto; }
.reset:hover { border-color: var(--muted); }
.tip {

  font-size: 12.5px; color: var(--ink); background: var(--haze); border: 1px solid var(--line);

}
.tip.on { opacity: 1; }
.record, .record * { transition: none !important; animation: none !important; }
.record .curve { position: absolute; left: 0; right: 0; bottom: 0; visibility: hidden; }

.reset { bottom: calc(var(--dock, 240px) + 10px); }
.panel { position: relative; flex: 1 1 0; min-width: 0; }

.panel::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 116px; z-index: 1;
  pointer-events: none; background: linear-gradient(to bottom, var(--sky) 0 48%, transparent); opacity: 0.92;

.panel:first-child .hud { left: 68px; }

.menu-picker {

  background: var(--haze); border: 1px solid var(--line); border-radius: 8px;
}
.menu-switch {
  padding: 8px 12px; text-align: left; font: inherit; font-size: 13.5px; cursor: pointer;

}

.menu-links { display: flex; gap: 18px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }

.record ~ .menu, .record ~ .menu-toggle { display: none; }

<script>
function upperBound(values, target, low = 0, high = values.length) {
  while (low < high) {
    const middle = (low + high) >> 1;
    if (values[middle] <= target) low = middle + 1;
    else high = middle;
  }
  return low;
}

function lowerBound(values, target, low = 0, high = values.length) {
  while (low < high) {
    const middle = (low + high) >> 1;
    if (values[middle] < target) low = middle + 1;
    else high = middle;
  }
  return low;
}

function clampUnit(value) {
  return Math.min(1, Math.max(0, value));
}

function smooth(share) {
  return share * share * (3 - 2 * share);
}

function easeOut(share) {
  return 1 - Math.pow(1 - share, 3);
}

function easeInOut(share) {
  return share < 0.5 ? 4 * share * share * share : 1 - Math.pow(2 - 2 * share, 3) / 2;
}

<script>
const TINT_WHITENING = 0.3;

function hexToRgb(hex) {
  const value = parseInt(hex.slice(1), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}

function rgba(hex, alpha) {
  const [red, green, blue] = hexToRgb(hex);
  return `rgba(${red},${green},${blue},${alpha})`;
}

function mixHex(base, other, share) {
  const from = hexToRgb(base);
  const to = hexToRgb(other);
  const mixed = from.map((value, index) => Math.round(value + (to[index] - value) * share));
  return "#" + mixed.map((value) => value.toString(16).padStart(2, "0")).join("");
}

function isDark(hex) {
  const [red, green, blue] = hexToRgb(hex);
  return 0.2126 * red + 0.7152 * green + 0.0722 * blue < 128;
}

function glowBlend(palette) {
  return isDark(palette.sky) ? "lighter" : "multiply";
}

function applyPalette(element, palette, font, labelFont = font) {

  const image = context.createImageData(width, height);

  const [x, y, reach] = [width / 2, height * 0.46, Math.hypot(width, height) * 0.62];

    const share = Math.min(1, Math.hypot((pixel % width) - x, Math.floor(pixel / width) - y) / reach);

    for (let channel = 0; channel < 3; channel += 1) {

    image.data[4 * pixel + 3] = 255;

<script>
const SPRITE = 128;
const CORE = 0.12;
const RING_AT = 0.68;
const RING_SOFTNESS = 0.13;
const RING_STEPS = 32;

function spriteCanvas() {
  const canvas = document.createElement("canvas");
  canvas.width = SPRITE;
  canvas.height = SPRITE;
  return canvas;
}

function radialSprite(stops) {
  const canvas = spriteCanvas();
  const context = canvas.getContext("2d");
  const half = SPRITE / 2;
  const gradient = context.createRadialGradient(half, half, 0, half, half, half);
  for (const [place, color] of stops) gradient.addColorStop(place, color);
  context.fillStyle = gradient;
  context.beginPath();
  context.arc(half, half, half, 0, 2 * Math.PI);
  context.fill();
  return canvas;
}

function starSprite(core, glow, look) {
  return radialSprite([
    [0, rgba(core, 1)],
    [look.core * 0.5, rgba(core, 0.95)],
    [look.core, rgba(core, 0.72)],
    [look.core * 1.6, rgba(glow, 0.5 * look.glow)],
    [look.core * 1.6 + 0.24, rgba(glow, 0.1 * look.glow)],
    [1, rgba(glow, 0)],
  ]);
}

function ringLevel(place) {
  return Math.exp(-Math.pow((place - RING_AT) / RING_SOFTNESS, 2));
}

function ringSprite(color) {
  const stops = [];
  const edge = ringLevel(1);
  for (let step = 0; step <= RING_STEPS; step += 1) {
    const place = step / RING_STEPS;
    stops.push([place, rgba(color, Math.max(0, ringLevel(place) - edge) / (1 - edge))]);
  }
  return radialSprite(stops);
}

function spikeSprite(color) {
  const canvas = spriteCanvas();
  const context = canvas.getContext("2d");
  const half = SPRITE / 2;
  for (const upright of [false, true]) {
    const gradient = upright
      ? context.createLinearGradient(half, 0, half, SPRITE)
      : context.createLinearGradient(0, half, SPRITE, half);
    gradient.addColorStop(0, rgba(color, 0));
    gradient.addColorStop(0.5, rgba(color, 0.85));
    gradient.addColorStop(1, rgba(color, 0));
    context.fillStyle = gradient;
    if (upright) context.fillRect(half - 2, 0, 4, SPRITE);
    else context.fillRect(0, half - 2, SPRITE, 4);
  }
  return canvas;
}

function buildSprites(palette, typeCount, look) {
  const tones = [palette.glow, palette.risk];
  const bright = { ...look, glow: 1 };
  return {
    look,
    stars: tintColors(palette, typeCount).map((tint) => starSprite(palette.star, tint, look)),
    flashes: tones.map((tone) => starSprite(palette.star, tone, bright)),
    rings: tones.map((tone) => ringSprite(tone)),
    spike: spikeSprite(palette.star),
  };
}

const spriteSets = new Map();

function warmSprites(palette, typeCount) {
  for (let crowd = CROWD_FLOOR; crowd <= 1 + 1e-9; crowd += CROWD_STEP) {
    spritesFor(palette, typeCount, lookFor(Math.round(crowd / CROWD_STEP) * CROWD_STEP));
  }
}

function spritesFor(palette, typeCount, look) {
  const key = look.crowd.toFixed(2);
  if (!spriteSets.has(key)) spriteSets.set(key, buildSprites(palette, typeCount, look));
  return spriteSets.get(key);
}

function drawSprite(context, sprite, x, y, size) {
  context.drawImage(sprite, x - size / 2, y - size / 2, size, size);
}

function drawRing(context, sprite, x, y, radius) {
  drawSprite(context, sprite, x, y, (2 * radius) / RING_AT);
}

<script>
const LONGEST_STEP = 0.1;
const SAVE_EVERY_MS = 400;
const RECORD_STEP = 1 / 30;

function isRecording() {
  return new URLSearchParams(window.location.search).has("record");
}

function recordOption(name) {
  return isRecording() ? new URLSearchParams(window.location.search).get(name) : null;
}

function overlayScale(root) {
  const scale = Number(recordOption("ui")) || 1;
  root.style.setProperty("--ui", String(scale));
  return scale;
}

function readStore(key) {
  try {
    return JSON.parse(window.sessionStorage.getItem(key));
  } catch {
    return null;
  }
}

function writeStore(key, value) {
  try {
    window.sessionStorage.setItem(key, JSON.stringify(value));
  } catch {
    return;
  }
}

class Clock {
  constructor(spec, unitSeconds, key) {
    this.start = spec.start;
    this.end = spec.end;
    this.unitSeconds = unitSeconds;
    this.key = `skillnet-player-${key}`;
    this.t = spec.start;
    this.speed = 1;
    this.playing = true;
    this.savedAt = 0;
    this.restore(readStore(this.key));
  }

  restore(saved) {
    if (!saved) return;
    this.t = Math.min(Math.max(saved.t, this.start), this.end);
    this.speed = saved.speed;
    this.playing = saved.playing && this.t < this.end;
  }

  save(now) {
    if (now - this.savedAt < SAVE_EVERY_MS) return;
    writeStore(this.key, { t: this.t, speed: this.speed, playing: this.playing });
    this.savedAt = now;
  }

  advance(seconds) {
    if (!this.playing) return false;
    const step = Math.min(seconds, LONGEST_STEP) * this.speed;
    this.t = Math.min(this.end, this.t + step / this.unitSeconds);
    if (this.t >= this.end) this.playing = false;
    return true;
  }

  seek(t) {
    this.t = Math.min(Math.max(t, this.start), this.end);
    this.savedAt = 0;
  }

  get finished() {
    return this.t >= this.end;
  }

  share() {
    return (this.t - this.start) / (this.end - this.start);
  }
}

<script>
class Growth {
  constructor(grow, count) {
    this.ramp = grow.ramp;
    this.time = Float64Array.from(grow.t);
    this.value = Float64Array.from(grow.v);
    this.first = new Int32Array(count + 1);
    for (const node of grow.n) this.first[node + 1] += 1;
    for (let node = 0; node < count; node += 1) this.first[node + 1] += this.first[node];
  }

  valueAt(node, t) {
    const low = this.first[node];
    const high = upperBound(this.time, t, low, this.first[node + 1]);
    if (high === low) return 0;
    const last = high - 1;
    const before = last > low ? this.value[last - 1] : 0;
    const share = Math.min(1, (t - this.time[last]) / this.ramp);
    return before + (this.value[last] - before) * share;
  }
}

<script>
class Motion {
  constructor(keys, count) {
    this.times = Float64Array.from(keys.times);
    this.first = Int32Array.from(keys.first);
    this.x = Float64Array.from(keys.x);
    this.y = Float64Array.from(keys.y);
    this.offset = new Int32Array(count);
    let at = 0;
    for (let node = 0; node < count; node += 1) {
      this.offset[node] = at - Math.max(this.first[node], 0);
      if (this.first[node] >= 0) at += this.times.length - this.first[node];
    }
    this.wx = new Float64Array(count);
    this.wy = new Float64Array(count);
    this.extent = [extent(this.x), extent(this.y)];
    const homes = Int32Array.from(this.first, (first, node) => this.offset[node] + Math.max(first, 0));
    this.hx = Float64Array.from(homes, (at, node) => (this.first[node] < 0 ? NaN : this.x[at]));
    this.hy = Float64Array.from(homes, (at, node) => (this.first[node] < 0 ? NaN : this.y[at]));
  }

  place(t) {
    const last = this.times.length - 1;
    const index = Math.max(0, Math.min(last, upperBound(this.times, t) - 1));
    const span = index < last ? this.times[index + 1] - this.times[index] : 1;
    const share = index < last ? smooth(clampUnit((t - this.times[index]) / span)) : 0;
    for (let node = 0; node < this.first.length; node += 1) this.placeNode(node, index, share);
  }

  placeNode(node, index, share) {
    const first = this.first[node];
    if (first < 0) {
      this.wx[node] = NaN;
      this.wy[node] = NaN;
      return;
    }
    const from = this.offset[node] + Math.max(index, first);
    const to = first > index ? from : this.offset[node] + Math.min(index + 1, this.times.length - 1);
    this.wx[node] = this.x[from] + (this.x[to] - this.x[from]) * share;
    this.wy[node] = this.y[from] + (this.y[to] - this.y[from]) * share;
  }
}

<script>
function sortedBy(count, keys) {
  return Int32Array.from({ length: count }, (_, index) => index).sort((a, b) => keys[a] - keys[b]);
}

function nearestEarlier(order, rank, motion) {
  const { hx, hy } = motion;
  const [x, y] = [hx[order[rank]], hy[order[rank]]];
  let best = -1;
  let closest = Infinity;
  for (let earlier = 0; earlier < rank; earlier += 1) {
    const other = order[earlier];
    const distance = (hx[other] - x) * (hx[other] - x) + (hy[other] - y) * (hy[other] - y);
    if (distance < closest) [best, closest] = [other, distance];
  }
  return best;
}

class Run {
  constructor(panel, count, timing) {
    const events = panel.events;
    this.title = panel.title;
    this.depart = Float64Array.from(events.t);
    this.arrive = Float64Array.from(events.a);
    this.source = Int32Array.from(events.s);
    this.copier = Int32Array.from(events.c);
    this.risk = Uint8Array.from(events.r);
    this.lit = Float64Array.from(panel.lit, (time) => (time < 0 ? Infinity : time));
    this.glow = Uint8Array.from(panel.glow);
    this.origin = Int32Array.from(panel.origin);
    this.settle = timing.settle;
    this.bloom = timing.bloom;
    this.glide = timing.glide;
    this.grow = new Growth(panel.grow, count);
    this.weeks = panel.weeks;
    this.prepareOrders();
    this.lighting = Uint8Array.from(this.copier, (node, index) => this.lights(node, index));
  }

  prepareOrders() {
    const count = this.depart.length;
    const settled = Float64Array.from(this.arrive, (time) => time + this.settle);
    this.settledOrder = sortedBy(count, settled);
    this.settledTimes = Float64Array.from(this.settledOrder, (index) => settled[index]);
    this.litOrder = sortedBy(this.lit.length, this.lit);
    this.litTimes = Float64Array.from(this.litOrder, (node) => this.lit[node]);
    let span = 0;
    for (let index = 0; index < count; index += 1) {
      span = Math.max(span, this.arrive[index] - this.depart[index]);
    }
    this.reach = span + this.settle;
  }

  lights(node, index) {
    return this.origin[node] === this.source[index] && Math.abs(this.lit[node] - this.depart[index]) < 1e-3;
  }

  adoptOrigins(motion) {
    const count = this.litCount(Number.MAX_VALUE);
    for (let rank = 1; rank < count; rank += 1) {
      const node = this.litOrder[rank];
      if (this.origin[node] < 0) this.origin[node] = nearestEarlier(this.litOrder, rank, motion);
    }
  }

  activeRange(t) {
    return [lowerBound(this.depart, t - this.reach), upperBound(this.depart, t)];
  }

  litCount(t) {
    return upperBound(this.litTimes, t);
  }
}

<script>
const UNIT_BASE = 640;
const HUD_ROOM = 64;
const MARGIN = 26;
const SPACING_REFERENCE = 18;
const CROWD_FLOOR = 0.1;
const CROWD_SHARE = 0.9;
const CROWD_STEP = 0.1;
const MAGNIFY_POWER = 0.3;

function extent(values) {
  let low = Infinity;
  let high = -Infinity;
  for (const value of values) {
    low = Math.min(low, value);
    high = Math.max(high, value);
  }
  return low <= high ? [low, Math.max(high, low + 1e-6)] : [-1, 1];
}

function crowding(px, py, order, count, ratio) {
  if (count < 2) return 1;
  let cx = 0;
  let cy = 0;
  for (let rank = 0; rank < count; rank += 1) {
    cx += px[order[rank]] / count;
    cy += py[order[rank]] / count;
  }
  const reach = Float64Array.from({ length: count }, (_, rank) => {
    const node = order[rank];
    return Math.hypot(px[node] - cx, py[node] - cy);
  }).sort();
  const radius = reach[Math.floor((count - 1) * CROWD_SHARE)] / ratio;
  const spacing = Math.sqrt((Math.PI * radius * radius) / (CROWD_SHARE * count));
  return Math.min(1, Math.max(CROWD_FLOOR, spacing / SPACING_REFERENCE));
}

function lookFor(crowd) {
  return {
    crowd,
    core: CORE / (0.3 + 0.7 * crowd),
    glow: 0.35 + 0.65 * crowd,
    reach: 0.35 + 0.65 * crowd,
    trail: 0.35 + 0.65 * crowd,
    width: 0.7 + 0.3 * crowd,
    flash: 0.45 + 0.55 * crowd,
    faintest: Math.min(1, 0.4 + 0.5 * crowd),
  };
}

class View {
  constructor(motion, count) {
    this.spans = motion.extent.map(([low, high]) => high - low);
    this.centre = motion.extent.map(([low, high]) => (low + high) / 2);
    this.px = new Float32Array(count);
    this.py = new Float32Array(count);
    this.look = lookFor(1);
    this.version = 0;
  }

  fit(width, height, ratio, bottom) {
    this.width = Math.max(1, Math.round(width * ratio));
    this.height = Math.max(1, Math.round(height * ratio));
    this.ratio = ratio;
    this.unit = (Math.min(width, height) / UNIT_BASE) * ratio;
    const room = [width - 2 * MARGIN, height - HUD_ROOM - MARGIN - bottom];
    this.scale = Math.min(room[0] / this.spans[0], room[1] / this.spans[1]) * ratio;
    this.middle = [this.width / 2, (HUD_ROOM + room[1] / 2) * ratio];
    this.version += 1;
  }

  project(frame, wx, wy) {
    const [zoom, x, y] = frame;
    const size = this.scale * zoom;
    for (let node = 0; node < wx.length; node += 1) {
      this.px[node] = this.middle[0] + (wx[node] - x) * size;
      this.py[node] = this.middle[1] - (wy[node] - y) * size;
    }
    this.frame = frame;
    this.magnify = Math.pow(Math.max(zoom, 1), MAGNIFY_POWER);
  }

  toWorld(sx, sy) {
    const [zoom, x, y] = this.frame;
    const size = this.scale * zoom;
    return [x + (sx - this.middle[0]) / size, y - (sy - this.middle[1]) / size];
  }

  refreshLook(run, count) {
    const crowd = crowding(this.px, this.py, run.litOrder, count, this.ratio);
    const stepped = Math.round(Math.min(1, crowd / this.magnify) / CROWD_STEP) * CROWD_STEP;
    if (Math.abs(stepped - this.look.crowd) < 1e-9) return false;
    this.look = lookFor(Math.max(CROWD_FLOOR, stepped));
    return true;
  }
}

<script>
const AUTO_EASE = 0.5;
const USER_EASE = 0.12;
const AUTO_ROOM = 1.2;
const AUTO_CLOSEST = 24;
const USER_ZOOM = [0.6, 40];
const SETTLED = 1e-4;

function easeFrame(now, goal, share) {
  const zoom = Math.exp(Math.log(now[0]) + (Math.log(goal[0]) - Math.log(now[0])) * share);
  return [zoom, now[1] + (goal[1] - now[1]) * share, now[2] + (goal[2] - now[2]) * share];
}

class Camera {
  constructor(view) {
    this.home = [1, view.centre[0], view.centre[1]];
    this.spans = view.spans;
    this.now = [...this.home];
    this.goal = [...this.home];
    this.user = false;
  }

  fit(box) {
    if (!box) return this.home;
    const share = Math.max((box[1] - box[0]) / this.spans[0], (box[3] - box[2]) / this.spans[1]);
    const zoom = Math.min(AUTO_CLOSEST, Math.max(1, 1 / Math.max(share * AUTO_ROOM, 1e-9)));
    return [zoom, (box[0] + box[1]) / 2, (box[2] + box[3]) / 2];
  }

  settled(frame) {
    const shift = Math.hypot(frame[1] - this.goal[1], frame[2] - this.goal[2]) * this.goal[0];
    return Math.abs(Math.log(frame[0] / this.goal[0])) < SETTLED && shift < SETTLED * this.spans[0];
  }

  step(seconds, box) {
    if (!this.user) this.goal = this.fit(box);
    const share = 1 - Math.exp(-seconds / (this.user ? USER_EASE : AUTO_EASE));
    const next = easeFrame(this.now, this.goal, share);
    const moving = !this.settled(next);
    this.now = moving ? next : [...this.goal];
    return moving;
  }

  take() {
    if (!this.user) this.goal = [...this.now];
    this.user = true;
  }

  zoomAt(view, sx, sy, factor) {
    this.take();
    const [wx, wy] = view.toWorld(sx, sy);
    const zoom = Math.min(USER_ZOOM[1], Math.max(USER_ZOOM[0], this.goal[0] * factor));
    const size = view.scale * zoom;
    this.goal = [zoom, wx - (sx - view.middle[0]) / size, wy + (sy - view.middle[1]) / size];
  }

  panBy(view, dx, dy) {
    this.take();
    const size = view.scale * this.now[0];
    this.goal = [this.goal[0], this.goal[1] - dx / size, this.goal[2] + dy / size];
    this.now = [this.now[0], this.now[1] - dx / size, this.now[2] + dy / size];
  }

  release() {
    this.user = false;
  }
}

<script>
const TRAIL_ALPHA = [0.42, 0.52];
const TRAIL_WIDTH = 1.15;
const COUNT_CAP = 12;
const TONES = 2;

function trailColors(palette) {
  return [palette.trail, palette.risk];
}

function trailAlpha(risk, look) {
  return TRAIL_ALPHA[risk] * look.trail;
}

class TrailPainter {
  constructor(run, palette) {
    this.run = run;
    this.colors = trailColors(palette);
    this.counts = new Map();
    this.counted = 0;
    this.layers = Array.from({ length: TONES * COUNT_CAP }, () => []);
  }

  sync(t) {
    const stop = upperBound(this.run.settledTimes, t);
    if (stop < this.counted) this.reset();
    for (let rank = this.counted; rank < stop; rank += 1) this.add(this.run.settledOrder[rank]);
    this.counted = stop;
  }

  reset() {
    this.counts.clear();
    this.counted = 0;
    for (const layer of this.layers) layer.length = 0;
  }

  add(index) {
    const run = this.run;
    const key = (run.source[index] * run.lit.length + run.copier[index]) * TONES + run.risk[index];
    const copies = (this.counts.get(key) || 0) + 1;
    this.counts.set(key, copies);
    if (copies <= COUNT_CAP) this.layers[run.risk[index] * COUNT_CAP + copies - 1].push(run.source[index], run.copier[index]);
  }

  draw(context, view, t) {
    this.sync(t);
    const { px, py } = view;
    context.lineWidth = TRAIL_WIDTH * view.unit * view.look.width;
    this.layers.forEach((pairs, layer) => {
      if (pairs.length === 0) return;
      const risk = Math.floor(layer / COUNT_CAP);
      context.beginPath();
      for (let index = 0; index < pairs.length; index += 2) {
        context.moveTo(px[pairs[index]], py[pairs[index]]);
        context.lineTo(px[pairs[index + 1]], py[pairs[index + 1]]);
      }
      context.strokeStyle = rgba(this.colors[risk], trailAlpha(risk, view.look));
      context.stroke();
    });
  }
}

in float tone;

  int at = int(index);
  return texelFetch(places, ivec2(at % ${PLACE_COLUMNS}, at / ${PLACE_COLUMNS}), 0).xy;

  vec2 to = place(ends.y);
  vec2 along = to - from;
  vec2 normal = vec2(-along.y, along.x) / max(length(along), 0.0001);

  vec2 point = mix(from, to, corner.x) + normal * corner.y * half_width;

  color = vec4(colors[tone] * alpha, alpha);

  const program = gl.createProgram();
  gl.attachShader(program, compileShader(gl, gl.VERTEX_SHADER, TRAIL_VERTEX));
  gl.attachShader(program, compileShader(gl, gl.FRAGMENT_SHADER, TRAIL_FRAGMENT));
  gl.linkProgram(program);
  return gl.getProgramParameter(program, gl.LINK_STATUS) ? program : null;
}

function bindAttribute(gl, program, name, values, size, divisor) {
  const location = gl.getAttribLocation(program, name);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, values, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(location);
  gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
  gl.vertexAttribDivisor(location, divisor);
}

function settledInstances(run) {
  const ends = new Float32Array(run.settledOrder.length * 2);
  const tones = new Float32Array(run.settledOrder.length);
  run.settledOrder.forEach((index, rank) => {
    ends.set([run.source[index], run.copier[index]], rank * 2);
    tones[rank] = run.risk[index];
  });
  return [ends, tones];
}

class GlTrails {
  constructor(gl, program, run, palette) {
    this.gl = gl;
    this.program = program;
    this.run = run;
    this.colors = new Float32Array(trailColors(palette).flatMap((hex) => hexToRgb(hex).map((value) => value / 255)));
    this.rows = Math.ceil(run.lit.length / PLACE_COLUMNS);
    this.uniforms = Object.fromEntries(
      ["canvas", "width", "colors", "alphas"].map((name) => [name, gl.getUniformLocation(program, name)])
    );
    this.alphas = new Float32Array(TONES);
    this.places = new Float32Array(PLACE_COLUMNS * this.rows * 2);
    this.vertices = gl.createVertexArray();
    gl.bindVertexArray(this.vertices);
    const [ends, tones] = settledInstances(run);
    bindAttribute(gl, program, "corner", new Float32Array(QUAD), 2, 0);
    bindAttribute(gl, program, "ends", ends, 2, 1);
    bindAttribute(gl, program, "tone", tones, 1, 1);
    this.texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, PLACE_COLUMNS, this.rows, 0, gl.RG, gl.FLOAT, this.places);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  }

  upload(view) {
    for (let node = 0; node < view.px.length; node += 1) {
      this.places[node * 2] = view.px[node];
      this.places[node * 2 + 1] = view.py[node];
    }
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.texture);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, PLACE_COLUMNS, this.rows, gl.RG, gl.FLOAT, this.places);
  }

  draw(context, view, t) {
    const gl = this.gl;
    this.upload(view);
    gl.viewport(0, 0, view.width, view.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    const uniforms = this.uniforms;
    gl.useProgram(this.program);
    gl.uniform2f(uniforms.canvas, view.width, view.height);
    gl.uniform1f(uniforms.width, TRAIL_WIDTH * view.unit * view.look.width);
    gl.uniform3fv(uniforms.colors, this.colors);
    for (let risk = 0; risk < TONES; risk += 1) this.alphas[risk] = trailAlpha(risk, view.look);
    gl.uniform1fv(uniforms.alphas, this.alphas);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(this.vertices);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, upperBound(this.run.settledTimes, t));
  }
}

function makeTrails(canvas, run, palette) {
  const gl = canvas.getContext("webgl2", { premultipliedAlpha: true, antialias: false });
  const program = gl && linkProgram(gl);
  return program ? new GlTrails(gl, program, run, palette) : new TrailPainter(run, palette);
}

<script>
const LINK_PEAK = [0.95, 1];
const LINK_WIDTH = [1.0, 1.3];
const ALPHA_LEVELS = 24;
const COMET_SIZE = 15;
const PULSE_SHARE = 0.45;
const PULSE_REACH = 11;

class LinkPainter {
  constructor(palette) {
    this.colors = trailColors(palette);
    this.buckets = Array.from({ length: TONES * ALPHA_LEVELS }, () => []);
    this.comets = [];
    this.pulses = [];
  }

  collect(run, view, t) {
    const [low, high] = run.activeRange(t);
    for (let index = low; index < high; index += 1) {
      const settled = run.arrive[index] + run.settle;
      if (t < settled) this.collectOne(run, view, t, index);
    }
  }

  collectOne(run, view, t, index) {
    const risk = run.risk[index];
    const from = run.source[index];
    const to = run.copier[index];
    const depart = run.depart[index];
    const arrive = run.arrive[index];
    const peak = LINK_PEAK[risk] * view.look.flash;
    let reach = 1;
    let alpha;
    if (t < arrive) {
      const share = (t - depart) / Math.max(arrive - depart, 1e-6);
      alpha = peak * smooth(clampUnit(share * 1.5));
      if (!run.lighting[index]) {
        reach = easeInOut(share);
        this.comets.push(index, reach, clampUnit(share * 5));
      }
    } else {
      const share = (t - arrive) / run.settle;
      alpha = trailAlpha(risk, view.look) + (peak - trailAlpha(risk, view.look)) * (1 - smooth(share));
      if (share < PULSE_SHARE && !run.lighting[index]) this.pulses.push(index, share / PULSE_SHARE);
    }
    const x = view.px[from] + (view.px[to] - view.px[from]) * reach;
    const y = view.py[from] + (view.py[to] - view.py[from]) * reach;
    const level = Math.min(ALPHA_LEVELS - 1, Math.round(alpha * (ALPHA_LEVELS - 1)));
    this.buckets[risk * ALPHA_LEVELS + level].push(view.px[from], view.py[from], x, y);
  }

  drawLines(context, run, view, t) {
    this.collect(run, view, t);
    this.buckets.forEach((segments, bucket) => this.stroke(context, segments, bucket, view.unit * view.look.width));
  }

  drawLights(context, run, view, sprites) {
    this.drawComets(context, run, view, sprites);
    this.drawPulses(context, run, view, sprites);
  }

  stroke(context, segments, bucket, unit) {
    if (segments.length === 0) return;
    const risk = Math.floor(bucket / ALPHA_LEVELS);
    const alpha = (bucket % ALPHA_LEVELS) / (ALPHA_LEVELS - 1);
    context.beginPath();
    for (let index = 0; index < segments.length; index += 4) {
      context.moveTo(segments[index], segments[index + 1]);
      context.lineTo(segments[index + 2], segments[index + 3]);
    }
    context.strokeStyle = rgba(this.colors[risk], alpha);
    context.lineWidth = LINK_WIDTH[risk] * unit;
    context.stroke();
    segments.length = 0;
  }

  drawComets(context, run, view, sprites) {
    const comets = this.comets;
    for (let index = 0; index < comets.length; index += 3) {
      const event = comets[index];
      const from = run.source[event];
      const to = run.copier[event];
      const x = view.px[from] + (view.px[to] - view.px[from]) * comets[index + 1];
      const y = view.py[from] + (view.py[to] - view.py[from]) * comets[index + 1];
      context.globalAlpha = comets[index + 2];
      drawSprite(context, sprites.flashes[run.risk[event]], x, y, COMET_SIZE * view.unit * view.look.width * view.magnify);
    }
    context.globalAlpha = 1;
    comets.length = 0;
  }

  drawPulses(context, run, view, sprites) {
    const pulses = this.pulses;
    for (let index = 0; index < pulses.length; index += 2) {
      const event = pulses[index];
      const share = pulses[index + 1];
      const node = run.copier[event];
      context.globalAlpha = 0.5 * Math.pow(1 - share, 2);
      const radius = (2 + PULSE_REACH * easeOut(share)) * view.unit * view.magnify;
      drawRing(context, sprites.rings[run.risk[event]], view.px[node], view.py[node], radius);
    }
    context.globalAlpha = 1;
    pulses.length = 0;
  }
}

<script>
const EXPOSURE_CELL = 9;
const EXPOSURE_TARGET = 5;
const EXPOSURE_FLOOR = 0.22;
const EXPOSURE_STEP = 0.02;
const EXPOSURE_ZOOM_STEP = 0.15;
const EXPOSURE_EVERY = 20;
const CELL_OFFSET = 32768;

function cellKey(column, row) {
  return (column + CELL_OFFSET) * 65536 + row + CELL_OFFSET;
}

class Exposure {
  constructor(count) {
    this.level = new Float32Array(count).fill(1);
    this.exposedAt = -1;
    this.zoom = 0;
    this.fitted = 0;
    this.calls = 0;
  }

  update(run, view, count) {
    const stale = Math.abs(count - this.exposedAt) > Math.max(3, count * EXPOSURE_STEP);
    const zoomed = Math.abs(view.frame[0] / this.zoom - 1) > EXPOSURE_ZOOM_STEP;
    this.calls = (this.calls + 1) % EXPOSURE_EVERY;
    if (!stale && !zoomed && this.calls > 0 && this.fitted === view.version) return;
    const cell = EXPOSURE_CELL * view.ratio;
    const columns = new Int32Array(count);
    const rows = new Int32Array(count);
    const counts = new Map();
    for (let rank = 0; rank < count; rank += 1) {
      const node = run.litOrder[rank];
      columns[rank] = Math.floor(view.px[node] / cell);
      rows[rank] = Math.floor(view.py[node] / cell);
      const key = cellKey(columns[rank], rows[rank]);
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    for (let rank = 0; rank < count; rank += 1) {
      const crowd = this.neighbours(counts, columns[rank], rows[rank]);
      this.level[run.litOrder[rank]] = Math.max(EXPOSURE_FLOOR, Math.min(1, Math.sqrt(EXPOSURE_TARGET / crowd)));
    }
    this.exposedAt = count;
    this.zoom = view.frame[0];
    this.fitted = view.version;
  }

  neighbours(counts, column, row) {
    let total = 0;
    for (let dx = -1; dx <= 1; dx += 1) {
      for (let dy = -1; dy <= 1; dy += 1) total += counts.get(cellKey(column + dx, row + dy)) || 0;
    }
    return total;
  }
}

<script>
const STAR_BASE = 0.95;
const STAR_STEP = 0.3;
const STAR_LIMIT = 6;
const SPIKE_FROM = 1.7;
const SPIKE_LENGTH = 9;
const FADE_SHARE = 0.18;
const FULL_BRIGHT = 4;
const FLASH_GROWTH = 2.4;
const RIPPLE_REACH = 26;
const RIPPLE_STRENGTH = 0.55;
const BLOOM_REACH = 30;
const BLOOM_SHARED = 2;

function starRadius(copies, floor, unit) {
  return Math.max(floor, Math.min(STAR_LIMIT, STAR_BASE + STAR_STEP * Math.sqrt(copies))) * unit;
}

function starBrightness(copies, faintest) {
  return faintest + (1 - faintest) * Math.min(1, Math.sqrt(copies) / FULL_BRIGHT);
}

function bloomShares(view, nodes, shares) {
  const reach = BLOOM_REACH * view.unit;
  for (const node of nodes) {
    let crowd = 0;
    for (const other of nodes) {
      crowd += Math.max(0, 1 - Math.hypot(view.px[node] - view.px[other], view.py[node] - view.py[other]) / reach);
    }
    shares[node] = Math.min(1, Math.sqrt(BLOOM_SHARED / crowd));
  }
}

function drawBloom(context, star, share, sprites) {
  const fading = Math.pow(1 - share, 2) * star.share;
  context.globalAlpha = fading * star.level;
  const flash = (2 * star.radius * (1 + FLASH_GROWTH * Math.pow(1 - share, 3))) / sprites.look.core;
  drawSprite(context, sprites.flashes[star.tone], star.x, star.y, flash);
  context.globalAlpha = RIPPLE_STRENGTH * star.share * star.level * sprites.look.reach * Math.pow(1 - share, 1.6);
  const radius = star.radius + RIPPLE_REACH * sprites.look.reach * star.unit * easeOut(share);
  drawRing(context, sprites.rings[star.tone], star.x, star.y, radius);
}

class StarPainter {
  constructor(nodes) {
    this.spike = Uint8Array.from(nodes.spike);
    this.tint = Uint8Array.from(nodes.tint);
    this.floor = Float32Array.from(nodes.floor || nodes.tint.map(() => 0));
    this.star = { x: 0, y: 0, radius: 0, unit: 1, tone: 0, bright: 1, level: 1, share: 1 };
    this.exposure = new Exposure(nodes.spike.length);
    this.shares = new Float32Array(nodes.spike.length);
  }

  draw(context, run, view, t, sprites) {
    const count = run.litCount(t);
    this.exposure.update(run, view, count);
    bloomShares(view, run.litOrder.subarray(run.litCount(t - run.bloom), count), this.shares);
    for (let rank = 0; rank < count; rank += 1) {
      const node = run.litOrder[rank];
      const age = t - run.lit[node];
      this.place(run, view, node, t);
      context.globalAlpha = this.star.bright * this.star.level * Math.min(1, age / (run.bloom * FADE_SHARE));
      this.drawStar(context, node, sprites);
      this.star.share = this.shares[node];
      if (age < run.bloom) drawBloom(context, this.star, age / run.bloom, sprites);
    }
    context.globalAlpha = 1;
  }

  place(run, view, node, t) {
    const star = this.star;
    star.x = view.px[node];
    star.y = view.py[node];
    star.unit = view.unit * view.magnify;
    const copies = run.grow.valueAt(node, t);
    star.radius = starRadius(copies, this.floor[node], star.unit);
    star.bright = starBrightness(copies, view.look.faintest);
    star.level = this.exposure.level[node];
    star.tone = run.glow[node];
  }

  drawStar(context, node, sprites) {
    const star = this.star;
    drawSprite(context, sprites.stars[this.tint[node]], star.x, star.y, (2 * star.radius) / sprites.look.core);
    if (this.spike[node] && star.radius > SPIKE_FROM * star.unit) {
      drawSprite(context, sprites.spike, star.x, star.y, SPIKE_LENGTH * star.radius);
    }
  }
}

<script>
const DAY_MS = 86400000;
const WEEK_DAYS = 7;
const DATE_FORMAT = new Intl.DateTimeFormat("en-GB", {
  day: "numeric",
  month: "short",
  year: "numeric",
  timeZone: "UTC",
});
const COUNT_FORMAT = new Intl.NumberFormat("en-US");

function dayAt(days, t) {
  const index = Math.max(0, Math.min(days.length - 1, Math.floor(t)));
  const share = Math.max(0, t - index);
  const next = index + 1 < days.length ? days[index + 1] : days[index] + WEEK_DAYS;
  return Math.max(0, days[index] + (next - days[index]) * share);
}

function clockLabel(clock, t) {
  if (clock.kind === "day") return `Day ${Math.floor(dayAt(clock.days, t))}`;
  const origin = Date.parse(clock.origin);
  const moment = Math.min(origin + t * WEEK_DAYS * DAY_MS, Date.parse(clock.last));
  return DATE_FORMAT.format(new Date(Math.max(origin, moment)));
}

function counted(count, one, many) {
  return `${COUNT_FORMAT.format(count)} ${count === 1 ? one : many}`;
}

function noteLabel(run, mode, t) {
  if (mode === "holders") return t < run.litTimes[0] ? "" : counted(run.litCount(t), "adopter", "adopters");
  const week = Math.floor(t);
  const copies = run.weeks.copies[week] || 0;
  if (copies === 0) return "";
  const off = run.weeks.off[week] || 0;
  const note = `${counted(copies, "copy", "copies")} this week`;
  return off ? `${note}, ${COUNT_FORMAT.format(off)} of them involving a repository outside this view` : note;
}

class Hud {
  constructor(host, title) {
    this.element = document.createElement("div");
    this.element.className = "hud";
    this.title = this.line("title", title);
    this.stamp = this.line("stamp", "");
    this.note = this.line("note", "");
    host.appendChild(this.element);
    if (!title) this.title.remove();
  }

  line(name, text) {
    const element = document.createElement("div");
    element.className = name;
    element.textContent = text;
    this.element.appendChild(element);
    return element;
  }

  update(stamp, note) {
    if (this.stamp.textContent !== stamp) this.stamp.textContent = stamp;
    if (this.note.textContent !== note) this.note.textContent = note;
  }
}
</script>
<script>
const RING_RADIUS = 6.5;
const RING_WIDTH = 1.6;

class AuditRings {
  constructor(panel) {
    this.nodes = Int32Array.from(panel.audited || []);
    this.from = panel.auditAt === undefined ? Infinity : panel.auditAt;
  }

  draw(context, run, view, t, colour) {
    if (t < this.from || this.nodes.length === 0) return;
    const radius = RING_RADIUS * view.unit * view.magnify;
    context.globalCompositeOperation = "source-over";
    context.globalAlpha = 1;
    context.strokeStyle = colour;
    context.lineWidth = RING_WIDTH * view.ratio;
    context.beginPath();
    for (const node of this.nodes) {
      if (run.lit[node] > t) continue;
      context.moveTo(view.px[node] + radius, view.py[node]);
      context.arc(view.px[node], view.py[node], radius, 0, 2 * Math.PI);
    }
    context.stroke();
  }
}

<script>
const HOVER_REACH = 9;
const LOOK_EVERY = 12;

class SkyPanel {
  constructor(host, scene, panel, motion) {
    this.element = element("div", "panel", host);
    this.background = element("canvas", "", this.element);
    this.trailCanvas = element("canvas", "", this.element);
    this.canvas = element("canvas", "", this.element);
    this.context = this.canvas.getContext("2d");
    this.palette = scene.palette;
    this.blend = glowBlend(scene.palette);
    this.typeCount = scene.types.length;
    const count = scene.nodes.spike.length;
    this.run = new Run(panel, count, scene.timing);
    this.run.adoptOrigins(motion);
    this.view = new View(motion, count);
    this.trails = makeTrails(this.trailCanvas, this.run, scene.palette);
    this.lines = new LinkPainter(scene.palette);
    this.stars = new StarPainter(scene.nodes);
    this.hud = new Hud(this.element, panel.title);
    this.rings = new AuditRings(panel);
    this.wx = new Float64Array(count);
    this.wy = new Float64Array(count);
    this.frames = 0;
  }

  resize(ratio, bottom) {
    const box = this.element.getBoundingClientRect();
    this.view.fit(box.width, box.height, ratio, bottom);
    for (const canvas of [this.canvas, this.trailCanvas, this.background]) {
      canvas.width = this.view.width;
      canvas.height = this.view.height;
    }
    this.sprites = spritesFor(this.palette, this.typeCount, this.view.look);
    paintHaze(this.background, this.palette);
  }

  place(t, motion) {
    const run = this.run;
    this.wx.set(motion.wx);
    this.wy.set(motion.wy);
    for (let rank = run.litCount(t - run.glide); rank < run.litCount(t); rank += 1) {
      const node = run.litOrder[rank];
      const origin = run.origin[node];
      if (origin < 0) continue;
      const share = easeInOut(clampUnit((t - run.lit[node]) / run.glide));
      this.wx[node] = this.wx[origin] + (this.wx[node] - this.wx[origin]) * share;
      this.wy[node] = this.wy[origin] + (this.wy[node] - this.wy[origin]) * share;
    }
  }

  extendBox(box, t) {
    let [left, right, bottom, top] = box || [Infinity, -Infinity, Infinity, -Infinity];
    for (let rank = 0; rank < this.run.litCount(t); rank += 1) {
      const node = this.run.litOrder[rank];
      const x = this.wx[node];
      const y = this.wy[node];
      if (Number.isNaN(x)) continue;
      left = Math.min(left, x);
      right = Math.max(right, x);
      bottom = Math.min(bottom, y);
      top = Math.max(top, y);
    }
    return left <= right ? [left, right, bottom, top] : box;
  }

  draw(t, frame, stamp, mode) {
    const { context, run, view } = this;
    view.project(frame, this.wx, this.wy);
    this.frames = (this.frames + 1) % LOOK_EVERY;
    if (this.frames === 0 && view.refreshLook(run, run.litCount(t))) {
      this.sprites = spritesFor(this.palette, this.typeCount, view.look);
    }
    context.globalCompositeOperation = "source-over";
    context.clearRect(0, 0, view.width, view.height);
    this.trails.draw(context, view, t);
    this.lines.drawLines(context, run, view, t);
    context.globalCompositeOperation = this.blend;
    this.stars.draw(context, run, view, t, this.sprites);
    this.lines.drawLights(context, run, view, this.sprites);
    this.rings.draw(context, run, view, t, this.palette.ink);
    this.hud.update(stamp, noteLabel(run, mode, t));
  }

  nearest(clientX, clientY, t) {
    const box = this.canvas.getBoundingClientRect();
    const ratio = this.view.ratio;
    const [x, y] = [(clientX - box.left) * ratio, (clientY - box.top) * ratio];
    let best = -1;
    let closest = Math.pow(HOVER_REACH * ratio, 2);
    for (let rank = 0; rank < this.run.litCount(t); rank += 1) {
      const node = this.run.litOrder[rank];
      const distance = Math.pow(this.view.px[node] - x, 2) + Math.pow(this.view.py[node] - y, 2);
      if (distance < closest) [best, closest] = [node, distance];
    }
    return best;
  }
}

<script>
const SWATCH = [24, 18];

function swatchCanvas(ratio) {
  const canvas = document.createElement("canvas");
  canvas.width = SWATCH[0] * ratio;
  canvas.height = SWATCH[1] * ratio;
  const context = canvas.getContext("2d");
  context.scale(ratio, ratio);
  return [canvas, context];
}

function paintStar(context, item, { sprites }) {
  const [x, y] = [SWATCH[0] / 2, SWATCH[1] / 2];
  drawSprite(context, sprites.stars[item.tint || 0], x, y, SWATCH[1]);
  drawSprite(context, sprites.stars[item.tint || 0], x, y, SWATCH[1] * 0.6);
  if (!item.spike) return;
  drawSprite(context, sprites.spike, x, y, SWATCH[0]);
  drawSprite(context, sprites.spike, x, y, SWATCH[1]);
}

function paintLink(context, item, { sprites, palette }) {
  const color = item.tone === "risk" ? palette.risk : palette.glow;
  context.strokeStyle = rgba(color, 0.9);
  context.lineWidth = 1.4;
  context.beginPath();
  context.moveTo(1, SWATCH[1] - 3);
  context.lineTo(SWATCH[0] - 1, 3);
  context.stroke();
  const sprite = sprites.flashes[item.tone === "risk" ? 1 : 0];
  drawSprite(context, sprite, SWATCH[0] * 0.68, SWATCH[1] * 0.37, 14);
}

function paintLine(context, item, { palette }) {
  context.strokeStyle = palette[item.tone];
  context.lineWidth = 2.1;
  context.setLineDash(item.dashed ? [5, 3] : []);
  context.beginPath();
  context.moveTo(2, SWATCH[1] / 2);
  context.lineTo(SWATCH[0] - 2, SWATCH[1] / 2);
  context.stroke();
}

function paintRing(context, item, { sprites, palette }) {
  paintStar(context, { tint: 0 }, { sprites });
  context.globalCompositeOperation = "source-over";
  context.strokeStyle = palette.ink;
  context.lineWidth = 1.6;
  context.beginPath();
  context.arc(SWATCH[0] / 2, SWATCH[1] / 2, 7, 0, 2 * Math.PI);
  context.stroke();
}

const SWATCH_PAINTERS = { link: paintLink, line: paintLine, ring: paintRing };

function legendItem(item, sprites, palette, ratio) {
  const element = document.createElement("span");
  element.className = "item";
  const [canvas, context] = swatchCanvas(ratio);
  context.globalCompositeOperation = glowBlend(palette);
  (SWATCH_PAINTERS[item.kind] || paintStar)(context, item, { sprites, palette });
  const label = document.createElement("span");
  label.textContent = item.label;
  element.append(canvas, label);
  return element;
}

function buildLegend(host, items, sprites, palette, ratio) {
  const element = document.createElement("div");
  element.className = "legend";
  for (const item of items) element.appendChild(legendItem(item, sprites, palette, ratio));
  host.appendChild(element);
  return element;
}

<script>
const PLOT_INSET = { left: 66, right: 24, top: 36, bottom: 26 };
const COMPACT_FORMAT = new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 1 });

function niceStep(span, count) {
  const raw = span / Math.max(1, count);
  const power = Math.pow(10, Math.floor(Math.log10(raw)));
  const scaled = raw / power;
  const step = scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10;
  return Math.max(1, step * power);
}

function niceTicks(highest, count) {
  const step = niceStep(Math.max(highest, 1), count);
  const top = Math.max(step, Math.ceil(highest / step) * step);
  const ticks = [];
  for (let value = 0; value <= top + 1e-9; value += step) ticks.push(value);
  return ticks;
}

function prepareSeries(line, step) {
  const t = Float64Array.from(line.t);
  const y = line.y.length ? Float64Array.from(line.y) : Float64Array.from(line.t, (_, index) => index + 1);
  return { label: line.label, tone: line.tone, dashed: Boolean(line.dashed), t, y, step };
}

function seriesValue(series, t) {
  const index = upperBound(series.t, t) - 1;
  if (series.step) return index < 0 ? 0 : series.y[index];
  if (index < 0) return series.y[0] || 0;
  if (index >= series.t.length - 1) return series.y[series.y.length - 1];
  const share = (t - series.t[index]) / (series.t[index + 1] - series.t[index]);
  return series.y[index] + (series.y[index + 1] - series.y[index]) * share;
}

function traceSeries(context, series, frame, end) {
  context.beginPath();
  context.moveTo(frame.x(series.t[0]), frame.y(series.step ? 0 : series.y[0]));
  for (let index = 0; index < series.t.length; index += 1) {
    if (series.step) context.lineTo(frame.x(series.t[index]), frame.y(index ? series.y[index - 1] : 0));
    context.lineTo(frame.x(series.t[index]), frame.y(series.y[index]));
  }
  context.lineTo(frame.x(end), frame.y(series.y[series.y.length - 1] || 0));
}

class PlotFrame {
  constructor(width, height, clock, top, right) {
    this.left = PLOT_INSET.left;
    this.right = width - right;
    this.top = PLOT_INSET.top;
    this.bottom = height - PLOT_INSET.bottom;
    this.start = clock.start;
    this.end = clock.end;
    this.highest = top;
  }

  x(t) {
    return this.left + ((t - this.start) / (this.end - this.start)) * (this.right - this.left);
  }

  y(value) {
    return this.bottom - (value / this.highest) * (this.bottom - this.top);
  }

  timeAt(x) {
    const share = clampUnit((x - this.left) / (this.right - this.left));
    return this.start + share * (this.end - this.start);
  }
}

<script>
const LABEL_FONT = 11.5;
const LABEL_GAP = 14;
const END_ROOM = 92;
const LABEL_ROOM = 6;

function labelPlaces(heights, lowest) {
  const places = [];
  for (const height of heights) places.push(Math.max(height - 4, places.length ? places[places.length - 1] + LABEL_GAP : -Infinity));
  const excess = places.length ? places[places.length - 1] - lowest : 0;
  return excess > 0 ? places.map((place) => place - excess) : places;
}

class GrowthCurve {
  constructor(host, scene, scrub) {
    this.element = document.createElement("div");
    this.element.className = "curve";
    this.canvas = document.createElement("canvas");
    this.element.appendChild(this.canvas);
    host.appendChild(this.element);
    this.context = this.canvas.getContext("2d");
    this.base = document.createElement("canvas");
    this.spec = scene.curve;
    this.clock = scene.clock;
    this.palette = scene.palette;
    this.font = scene.font;
    this.series = scene.curve.series.map((line) => prepareSeries(line, scene.curve.step)).sort((a, b) => a.dashed - b.dashed);
    this.listen(scrub);
  }

  tone(name) {
    const tones = { risk: this.palette.risk, ink: this.palette.ink, glow: this.palette.glow, mark: this.palette.mark };
    return tones[name] || this.palette.muted;
  }

  text(context, size, color, align) {
    context.font = `${size}px ${this.font}`;
    context.fillStyle = color;
    context.textAlign = align;
  }

  label(context, text, x, y) {
    context.strokeStyle = this.palette.sky;
    context.lineWidth = 3;
    context.lineJoin = "round";
    context.strokeText(text, x, y);
    context.fillText(text, x, y);
  }

  listen(scrub) {
    const canvas = this.canvas;
    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      scrub.begin(this.frame.timeAt(event.offsetX));
    });
    canvas.addEventListener("pointermove", (event) => {
      if (canvas.hasPointerCapture(event.pointerId)) scrub.move(this.frame.timeAt(event.offsetX));
    });
    canvas.addEventListener("pointerup", () => scrub.end());
  }

  resize(ratio, scale) {
    const box = this.element.getBoundingClientRect();
    this.ratio = ratio * scale;
    this.width = box.width / scale;
    this.height = box.height / scale;
    for (const canvas of [this.canvas, this.base]) {
      canvas.width = Math.round(box.width * ratio);
      canvas.height = Math.round(box.height * ratio);
    }
    const highest = Math.max(1, ...this.series.map((line) => Math.max(...line.y, 0)));
    this.ticks = niceTicks(highest * 1.06, 3);
    const right = this.spec.ends ? END_ROOM : PLOT_INSET.right;
    this.frame = new PlotFrame(this.width, this.height, this.clock, this.ticks[this.ticks.length - 1], right);
    paintCurveBase(this, this.base.getContext("2d"));
    this.markPlan = markLabels(this, this.base.getContext("2d"));
  }

  draw(t) {
    const context = this.context;
    const frame = this.frame;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.drawImage(this.base, 0, 0);
    context.setTransform(this.ratio, 0, 0, this.ratio, 0, 0);
    const cursor = frame.x(t);
    this.clipPlot(context, cursor);
    for (const line of this.series) this.stroke(context, line, line.tone === "faint" ? 0.9 : 1, 2.4);
    context.restore();
    context.strokeStyle = rgba(this.palette.ink, 0.4);
    context.lineWidth = 1;
    context.beginPath();
    context.moveTo(cursor, frame.top - 6);
    context.lineTo(cursor, frame.bottom);
    context.stroke();
    if (this.spec.values !== false) this.drawValues(context, t, cursor);
  }

  clipPlot(context, right) {
    context.save();
    context.beginPath();
    context.rect(this.frame.left, 0, Math.max(0, right - this.frame.left), this.height);
    context.clip();
  }

  stroke(context, line, alpha, width) {
    traceSeries(context, line, this.frame, this.clock.end);
    context.strokeStyle = rgba(this.tone(line.tone), alpha);
    context.lineWidth = width;
    context.lineJoin = "round";
    context.setLineDash(line.dashed ? [3 * width, 2.5 * width] : []);
    context.stroke();
    context.setLineDash([]);
  }

  drawValues(context, t, cursor) {
    const shown = this.series.filter((line) => line.tone !== "faint");
    const points = shown.map((line) => ({ line, value: Math.round(seriesValue(line, t)) }));
    points.sort((a, b) => b.value - a.value || (a.line.tone === "risk" ? -1 : 1));
    const distinct = points.filter((point, index) => index === 0 || point.value !== points[index - 1].value);
    const places = labelPlaces(distinct.map((point) => this.frame.y(point.value)), this.frame.bottom - LABEL_ROOM);
    const flip = cursor > this.frame.right - 56;
    const labels = distinct.map((point, index) => ({ point, y: places[index], text: COUNT_FORMAT.format(point.value) }));
    const align = flip ? "right" : "left";
    const x = cursor + (flip ? -7 : 7);
    this.text(context, LABEL_FONT, this.palette.ink, align);
    drawMarkLabels(this, context, labels.map((item) => labelBox(context, item.text, x, item.y, align)));
    for (const item of labels) {
      const color = this.tone(item.point.line.tone);
      context.fillStyle = color;
      context.beginPath();
      context.arc(cursor, this.frame.y(item.point.value), 3.2, 0, 2 * Math.PI);
      context.fill();
      this.text(context, LABEL_FONT, color, align);
      this.label(context, item.text, x, item.y);
    }
  }
}
</script>
<script>
function paintCurveBase(curve, context) {
  context.setTransform(curve.ratio, 0, 0, curve.ratio, 0, 0);
  context.fillStyle = curve.palette.sky;
  context.fillRect(0, 0, curve.width, curve.height);
  paintGrid(curve, context);
  paintTimeTicks(curve, context);
  curve.clipPlot(context, curve.frame.right);
  for (const line of curve.series) curve.stroke(context, line, line.tone === "faint" ? 0.45 : 0.3, 1.4);
  context.restore();
  paintMarks(curve, context);
  paintRules(curve, context);
  paintEnds(curve, context);
  paintAxis(curve, context);
  curve.text(context, 12.5, curve.palette.ink, "left");
  context.fillText(curve.spec.title, PLOT_INSET.left - 52, 20);
}

function paintGrid(curve, context) {
  const frame = curve.frame;
  context.strokeStyle = curve.palette.line;
  context.lineWidth = 1;
  curve.text(context, LABEL_FONT, curve.palette.muted, "right");
  context.textBaseline = "middle";
  for (const value of curve.ticks) {
    const y = Math.round(frame.y(value)) + 0.5;
    context.beginPath();
    context.moveTo(frame.left, y);
    context.lineTo(frame.right, y);
    context.stroke();
    context.fillText(COMPACT_FORMAT.format(value), frame.left - 10, y);
  }
  context.textBaseline = "alphabetic";
}

function paintTimeTicks(curve, context) {
  const frame = curve.frame;
  curve.text(context, LABEL_FONT, curve.palette.muted, "center");
  context.strokeStyle = curve.palette.muted;
  for (const tick of visibleTicks(curve, context)) {
    const x = frame.x(tick.t);
    context.beginPath();
    context.moveTo(x, frame.bottom);
    context.lineTo(x, frame.bottom + 4);
    context.stroke();
    context.fillText(tick.label, x, frame.bottom + 17);
  }
}

function paintAxis(curve, context) {
  if (!curve.spec.axis) return;
  curve.text(context, LABEL_FONT, curve.palette.muted, "right");
  context.fillText(curve.spec.axis, curve.frame.right, 20);
}

function paintMarks(curve, context) {
  const frame = curve.frame;
  for (const mark of curve.spec.marks) {
    const [x, y] = [frame.x(mark.t), frame.y(mark.y)];
    context.fillStyle = curve.palette.mark;
    context.beginPath();
    context.arc(x, y, 3.6, 0, 2 * Math.PI);
    context.fill();
  }
}

function paintRules(curve, context) {
  const frame = curve.frame;
  curve.text(context, LABEL_FONT, curve.palette.ink, "left");
  context.strokeStyle = rgba(curve.palette.ink, 0.6);
  context.setLineDash([4, 4]);
  for (const rule of curve.spec.rules || []) {
    const x = Math.round(frame.x(rule.t)) + 0.5;
    context.beginPath();
    context.moveTo(x, frame.top - 6);
    context.lineTo(x, frame.bottom);
    context.stroke();
    curve.label(context, rule.label, x + 6, frame.top + 4);
  }
  context.setLineDash([]);
}

function paintEnds(curve, context) {
  if (!curve.spec.ends) return;
  const frame = curve.frame;
  const ends = curve.series.map((line) => ({ line, y: frame.y(line.y[line.y.length - 1]) }));
  ends.sort((a, b) => a.y - b.y);
  let floor = -Infinity;
  for (const end of ends) {
    const y = Math.max(end.y + 4, floor + LABEL_GAP);
    floor = y;
    curve.text(context, LABEL_FONT, curve.tone(end.line.tone), "left");
    curve.label(context, end.line.label, frame.right + 8, y);
  }
}
</script>
<script>
const LABEL_PAD = 3;
const TICK_GAP = 6;

function labelBox(context, text, x, y, align) {
  const width = context.measureText(text).width;
  const left = align === "right" ? x - width : x;
  return [left - LABEL_PAD, y - LABEL_FONT, left + width + LABEL_PAD, y + LABEL_PAD];
}

function boxesCollide(a, b) {
  return a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3];
}

function markLabels(curve, context) {
  curve.text(context, LABEL_FONT, curve.palette.ink, "left");
  const kept = [];
  for (const mark of [...curve.spec.marks].sort((a, b) => a.t - b.t)) {
    const free = markPlaces(curve, context, mark).find((place) => !kept.some((other) => boxesCollide(place.box, other.box)));
    if (free) kept.push({ mark, ...free });
  }
  return kept;
}

function markPlaces(curve, context, mark) {
  const [x, y] = [curve.frame.x(mark.t), curve.frame.y(mark.y) - 9];
  const left = { x: x - 5, y, box: labelBox(context, mark.label, x - 5, y, "right"), align: "right" };
  const right = { x: x + 5, y, box: labelBox(context, mark.label, x + 5, y, "left"), align: "left" };
  return left.box[0] > curve.frame.left + LABEL_PAD ? [left, right] : [right];
}

function drawMarkLabels(curve, context, taken) {
  for (const { mark, x, y, box, align } of curve.markPlan) {
    curve.text(context, LABEL_FONT, curve.palette.ink, align);
    if (!taken.some((other) => boxesCollide(box, other))) curve.label(context, mark.label, x, y);
  }
}

function visibleTicks(curve, context) {
  curve.text(context, LABEL_FONT, curve.palette.muted, "center");
  let edge = -Infinity;
  return curve.clock.ticks.filter((tick) => {
    const x = curve.frame.x(tick.t);
    const half = context.measureText(tick.label).width / 2;
    if (x < curve.frame.left - 1 || x > curve.frame.right + 1 || x - half < edge + TICK_GAP) return false;
    edge = x + half;
    return true;
  });
}
</script>
<script>
const SPEEDS = [0.5, 1, 2, 4];
const ICONS = {
  play: "M4 2v12l10-6z",
  pause: "M3.5 2h3v12h-3zM9.5 2h3v12h-3z",
  replay: "M8 2.5V0L4.5 3 8 6V3.9a4.1 4.1 0 1 1-4.1 4.1H2.5A5.5 5.5 0 1 0 8 2.5z",
};
const SVG_SPACE = "http://www.w3.org/2000/svg";

function element(tag, name, host) {
  const made = document.createElement(tag);
  made.className = name;
  host.appendChild(made);
  return made;
}

function iconButton(host) {
  const button = element("button", "play", host);
  const svg = document.createElementNS(SVG_SPACE, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  const path = document.createElementNS(SVG_SPACE, "path");
  svg.appendChild(path);
  button.appendChild(svg);
  return [button, path];
}

class Controls {
  constructor(host, clock, player) {
    this.element = element("div", "controls", host);
    [this.button, this.icon] = iconButton(this.element);
    this.button.addEventListener("click", () => player.toggle());
    this.speeds = this.speedButtons(player);
    this.range = this.slider(clock, player.scrub);
    this.state = {};
  }

  speedButtons(player) {
    const group = element("div", "speeds", this.element);
    return SPEEDS.map((speed) => {
      const button = element("button", "", group);
      button.textContent = `${speed}×`;
      button.addEventListener("click", () => player.changeSpeed(speed));
      return button;
    });
  }

  slider(clock, scrub) {
    const range = element("input", "scrub", this.element);
    Object.assign(range, { type: "range", min: clock.start, max: clock.end, step: "any" });
    range.setAttribute("aria-label", "Timeline");
    range.addEventListener("pointerdown", () => scrub.begin(Number(range.value)));
    range.addEventListener("input", () => scrub.move(Number(range.value)));
    range.addEventListener("change", () => scrub.end());
    return range;
  }

  update(clock) {
    const icon = clock.playing ? "pause" : clock.finished ? "replay" : "play";
    if (this.state.icon !== icon) {
      this.icon.setAttribute("d", ICONS[icon]);
      this.button.setAttribute("aria-label", icon);
    }
    if (this.state.speed !== clock.speed) {
      SPEEDS.forEach((speed, index) => this.speeds[index].classList.toggle("on", speed === clock.speed));
    }
    this.range.value = clock.t;
    this.range.style.setProperty("--done", `${(clock.share() * 100).toFixed(2)}%`);
    this.state = { icon, speed: clock.speed };
  }
}
</script>
<script>
const WHEEL_RATE = 0.0016;
const PINCH_RATE = 0.012;
const LINE_PIXELS = 16;
const DRAG_FROM = 3;
const TIP_OFFSET = 14;

class Pointer {
  constructor(player) {
    this.player = player;
    const host = player.host;
    this.tip = element("div", "tip", player.root);
    this.reset = element("button", "reset", host);
    this.reset.textContent = "Reset view";
    this.reset.addEventListener("click", () => this.release());
    host.addEventListener("wheel", (event) => this.wheel(event), { passive: false });
    host.addEventListener("pointerdown", (event) => this.grab(event));
    host.addEventListener("pointermove", (event) => this.move(event));
    host.addEventListener("pointerup", (event) => this.drop(event));
    host.addEventListener("pointerleave", () => this.tip.classList.remove("on"));
    host.addEventListener("dblclick", () => this.release());
  }

  local(event) {
    const panel = this.player.panels.find((item) => item.element.contains(event.target)) || this.player.panels[0];
    const box = panel.canvas.getBoundingClientRect();
    const ratio = panel.view.ratio;
    return [panel, (event.clientX - box.left) * ratio, (event.clientY - box.top) * ratio];
  }

  wheel(event) {
    event.preventDefault();
    const [panel, sx, sy] = this.local(event);
    const delta = event.deltaY * (event.deltaMode ? LINE_PIXELS : 1);
    const factor = Math.exp(-delta * (event.ctrlKey ? PINCH_RATE : WHEEL_RATE));
    this.player.camera.zoomAt(panel.view, sx, sy, factor);
    this.player.dirty = true;
  }

  grab(event) {
    if (event.button !== 0 || event.target === this.reset) return;
    this.drag = { x: event.clientX, y: event.clientY, moved: false };
    this.player.host.setPointerCapture(event.pointerId);
  }

  move(event) {
    if (!this.drag) return this.hover(event);
    const [dx, dy] = [event.clientX - this.drag.x, event.clientY - this.drag.y];
    if (!this.drag.moved && Math.hypot(dx, dy) < DRAG_FROM) return;
    const [panel] = this.local(event);
    this.drag = { x: event.clientX, y: event.clientY, moved: true };
    this.player.host.classList.add("dragging");
    this.tip.classList.remove("on");
    this.player.camera.panBy(panel.view, dx * panel.view.ratio, dy * panel.view.ratio);
    this.player.dirty = true;
  }

  drop(event) {
    this.drag = null;
    this.player.host.classList.remove("dragging");
    if (this.player.host.hasPointerCapture(event.pointerId)) this.player.host.releasePointerCapture(event.pointerId);
  }

  release() {
    this.player.camera.release();
    this.player.dirty = true;
  }

  update() {
    this.reset.classList.toggle("on", this.player.camera.user);
  }

  hover(event) {
    const t = this.player.clock.t;
    const panel = this.player.panels.find((item) => item.element.contains(event.target));
    const node = panel ? panel.nearest(event.clientX, event.clientY, t) : -1;
    if (node < 0) return this.tip.classList.remove("on");
    const nodes = this.player.scene.nodes;
    const copies = Math.round(panel.run.grow.valueAt(node, t));
    this.tip.textContent = `${nodes.tips[nodes.tip[node]]}, ${counted(copies, "copy", "copies")} passed on`;
    const box = this.player.root.getBoundingClientRect();
    const left = Math.min(event.clientX - box.left + TIP_OFFSET, box.width - this.tip.offsetWidth - 8);
    this.tip.style.left = `${left}px`;
    this.tip.style.top = `${event.clientY - box.top + TIP_OFFSET}px`;
    this.tip.classList.add("on");
  }
}
</script>
<script>
const FADE_MS = 420;
const CAPTION_MS = 7000;

function showCaption(root, text) {
  const caption = element("div", "caption", root);
  caption.textContent = text;
  window.setTimeout(() => caption.classList.add("faded"), CAPTION_MS);
}

function pixelRatio() {
  return Math.min(2, window.devicePixelRatio || 1);
}

class Player {
  constructor(root, scene) {
    this.root = root;
    this.scene = scene;
    applyPalette(root, scene.palette, scene.font);
    root.classList.toggle("record", isRecording());
    root.classList.toggle("curved", recordOption("curve") !== null);
    this.uiScale = overlayScale(root);
    this.clock = new Clock(scene.clock, scene.timing.unitSeconds, scene.key);
    this.motion = new Motion(scene.keys, scene.nodes.spike.length);
    this.host = element("div", "panels", root);
    element("div", "brand", root).textContent = scene.brand;
    showCaption(root, scene.caption);
    this.panels = scene.panels.map((panel) => new SkyPanel(this.host, scene, panel, this.motion));
    this.camera = new Camera(this.panels[0].view);
    warmSprites(scene.palette, scene.types.length);
    const sprites = spritesFor(scene.palette, scene.types.length, lookFor(1));
    this.dock = element("div", "dock", root);
    buildLegend(this.dock, scene.legend, sprites, scene.palette, pixelRatio());
    this.scrub = this.scrubber();
    this.controls = new Controls(this.dock, this.clock, this);
    this.curve = new GrowthCurve(this.dock, scene, this.scrub);
    this.pointer = new Pointer(this);
    document.addEventListener("keydown", (event) => this.key(event));
    new ResizeObserver(() => this.resize()).observe(root);
  }

  scrubber() {
    return {
      begin: (t) => {
        this.resume = this.resume || this.clock.playing;
        this.clock.playing = false;
        this.seek(t);
      },
      move: (t) => this.seek(t),
      end: () => {
        this.clock.playing = Boolean(this.resume) && !this.clock.finished;
        this.resume = false;
        this.dirty = true;
      },
    };
  }

  seek(t) {
    this.clock.seek(t);
    this.dirty = true;
  }

  toggle() {
    if (this.clock.finished) return this.restart();
    this.clock.playing = !this.clock.playing;
    this.dirty = true;
  }

  changeSpeed(speed) {
    this.clock.speed = speed;
    this.dirty = true;
  }

  restart() {
    this.root.classList.add("fading");
    window.setTimeout(() => {
      this.seek(this.clock.start);
      this.clock.playing = true;
      this.root.classList.remove("fading");
    }, FADE_MS);
  }

  key(event) {
    const steps = { ArrowLeft: -1, ArrowRight: 1 };
    if (event.target.closest("button, input")) return;
    if (event.code === "Space") this.toggle();
    else if (event.code in steps) this.seek(this.clock.t + steps[event.code]);
    else return;
    event.preventDefault();
  }

  resize() {
    const ratio = pixelRatio();
    const bottom = this.dock.offsetHeight;
    this.root.style.setProperty("--dock", `${bottom}px`);
    const room = Math.max(bottom, Number(recordOption("room")) || 0);
    this.root.style.setProperty("--room", `${room}px`);
    for (const panel of this.panels) panel.resize(ratio, room);
    this.curve.resize(ratio, this.uiScale);
    this.dirty = true;
    if (!this.started) this.start();
  }

  start() {
    this.started = true;
    this.camera.now = this.camera.fit(this.locate());
    this.render();
    this.root.classList.add("ready");
    if (!isRecording()) requestAnimationFrame((now) => this.frame(now));
  }

  locate() {
    const t = this.clock.t;
    this.motion.place(t);
    let box = null;
    for (const panel of this.panels) {
      panel.place(t, this.motion);
      box = panel.extendBox(box, t);
    }
    return box;
  }

  frame(now) {
    const seconds = this.last === undefined ? 0 : Math.min((now - this.last) / 1000, LONGEST_STEP);
    this.last = now;
    const advanced = this.clock.advance(seconds);
    const moving = this.camera.step(seconds, this.locate());
    if (advanced || moving || this.dirty) {
      this.render();
      this.clock.save(now);
    }
    requestAnimationFrame((time) => this.frame(time));
  }

  render() {
    const t = this.clock.t;
    const stamp = clockLabel(this.scene.clock, t);
    for (const panel of this.panels) panel.draw(t, this.camera.now, stamp, this.scene.hud);
    this.curve.draw(t);
    this.controls.update(this.clock);
    this.pointer.update();
    this.dirty = false;
  }
}

window.player = new Player(document.getElementById("player"), JSON.parse(document.getElementById("scene").textContent));
</script>
<script>
const PlayerRecord = {
  renderAt(t, zoom) {
    this.clock.seek(t);
    const box = this.locate();
    if (recordOption("final") === null) this.camera.step(RECORD_STEP, box);
    else this.camera.now = this.finalFrame(zoom || 1);
    this.render();
  },

  finalFrame(zoom) {
    let box = null;
    for (const panel of this.panels) box = panel.extendBox(box, this.clock.end);
    const [fit, x, y] = this.camera.fit(box);
    return [fit * zoom, x, y];
  },
};

Object.assign(Player.prototype, PlayerRecord);
</script>

<script>
const MENU_KEY = "skillnet-menu";
const MENU_WIDE = window.matchMedia("(min-width: 721px)");

function setMenu(open, remember) {
  document.body.classList.toggle("menu-open", open);
  document.querySelector(".menu-toggle").setAttribute("aria-expanded", String(open));
  if (remember && MENU_WIDE.matches) writeStore(MENU_KEY, open);
}

function bindSwitch(button, apply) {
  button.addEventListener("click", () => {
    const on = button.getAttribute("aria-pressed") !== "true";
    button.setAttribute("aria-pressed", String(on));
    apply(on);
  });
}

function bindSky(sky) {
  const names = document.querySelector('[data-toggle="names"]');
  const colour = document.querySelector('[data-toggle="colour"]');
  if (!names || !colour) return;
  names.setAttribute("aria-pressed", String(sky.namesOn));
  colour.setAttribute("aria-pressed", String(sky.scene.clumps.coloured));
  bindSwitch(names, (on) => sky.setNames(on));
  bindSwitch(colour, (on) => sky.setColoured(on));
}

function bindMenu() {
  setMenu(MENU_WIDE.matches && !isRecording() && readStore(MENU_KEY) !== false, false);
  document.querySelector(".menu-toggle").addEventListener("click", () => setMenu(true, true));
  document.querySelector(".menu-close").addEventListener("click", () => setMenu(false, true));
  document.querySelector(".menu-picker").addEventListener("change", (event) => {
    window.location.href = event.target.value;
  });
  if (window.skyView) bindSky(window.skyView);
}

bindMenu();
</script></body>
